<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4900">
<meta name="description" content="Find rooms, routes, your next lecture and the MDU bus for Campus Västerås and Eskilstuna. Unofficial student prototype.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MDU Navigator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MDU Navigator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="mark" id="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.2 7 12 7 12s7-6.8 7-12a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg></div>
    <h1><span data-t="appTitle"></span><small data-t="appSub"></small></h1>
    <button class="ghost" id="langBtn" type="button">Svenska</button>
  </header>
  <main>
    <section class="view on" id="v-next" aria-labelledby="tab-next"></section>
    <section class="view" id="v-search" aria-labelledby="tab-search">
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" inputmode="search">
      </label>
      <div class="card list" id="results"></div>
    </section>
    <section class="view" id="v-map" aria-labelledby="tab-map">
      <div class="mapwrap">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="mapbar">
          <div class="seg" id="campSeg"></div>
          <div class="seg" id="bldSeg"></div>
          <div class="seg" id="floorSeg"></div>
        </div>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zout" aria-label="Zoom out">−</button>
          <button type="button" id="zfit" aria-label="Fit" style="font-size:15px">⤢</button>
        </div>
        <div class="sheet" id="sheet"></div>
      </div>
    </section>
    <section class="view" id="v-places" aria-labelledby="tab-places"></section>
    <section class="view" id="v-bus" aria-labelledby="tab-bus"></section>
    <div class="overlay" id="ov"><div class="dialog" id="dlg"></div></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <nav role="tablist">
    <button role="tab" id="tab-next" data-v="next" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tNext"></span></button>
    <button role="tab" id="tab-search" data-v="search" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-t="tSearch"></span></button>
    <button role="tab" id="tab-map" data-v="map" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="tMap"></span></button>
    <button role="tab" id="tab-places" data-v="places" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-t="tPlaces"></span></button>
    <button role="tab" id="tab-bus" data-v="bus" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8.5" cy="14.5" r="1"/><circle cx="15.5" cy="14.5" r="1"/></svg><span data-t="tBus"></span></button>
  </nav>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
